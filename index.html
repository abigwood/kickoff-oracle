<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0D14">
<title>KickOff Oracle - Retired</title>
<meta name="description" content="KickOff Oracle has been retired after the 2026 World Cup predictor run.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d14;
  --panel: #141927;
  --line: #283149;
  --text: #f2f5fb;
  --muted: #a0a8ba;
  --accent: #ffd230;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at 50% 0%, rgba(255, 210, 48, 0.12), transparent 34rem),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Roboto, sans-serif;
}
main {
  width: min(100%, 560px);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(20, 25, 39, 0.92);
  padding: clamp(24px, 6vw, 44px);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
}
.label {
  display: inline-flex;
  margin-bottom: 18px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-size: clamp(2.2rem, 11vw, 4.6rem);
  line-height: 0.95;
  letter-spacing: 0;
}
p {
  margin: 18px 0 0;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.55;
}
.note {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 0.9rem;
}
</style>
</head>
<body>
<main>
  <div class="label">App retired</div>
  <h1>KickOff Oracle has closed.</h1>
  <p>
    This World Cup predictor has been decommissioned after its run. The public app,
    live data refreshes and league backup automation are no longer active.
  </p>
  <p class="note">Thanks for playing.</p>
</main>
<script>
(async () => {
  if (!("serviceWorker" in navigator)) return;
  try {
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map((registration) => registration.unregister()));
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map((key) => caches.delete(key)));
    }
  } catch {}
})();
</script>
</body>
</html>
