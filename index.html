<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KickOff Oracle">
<meta name="theme-color" content="#0B0D14">
<title>KickOff Oracle — World Cup 2026 UK TV Guide</title>
<meta name="description" content="Every World Cup 2026 match: UK kick-off time and BBC/ITV channel, groups, bracket and England's route to the final.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D14; --surface:#131724; --raise:#1A2032; --line:#242C42;
  --text:#EEF1F7; --dim:#8A93A8; --faint:#5A6378;
  --bbc:#FFD230; --itv:#2BD9CE; --live:#FF4D5A; --win:#39D98A;
  --pad:16px; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  min-height:100vh; overscroll-behavior-y:none;
}
.arc{font-family:"Archivo",-apple-system,sans-serif}
header{
  position:sticky; top:0; z-index:30; background:rgba(11,13,20,.85);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
  display:flex; align-items:baseline; justify-content:space-between;
}
.wordmark{font-family:"Archivo";font-weight:900;font-stretch:115%;font-size:1.15rem;letter-spacing:-.01em}
.wordmark .tv{color:var(--bbc)}
.updated{font-size:.68rem;color:var(--faint)}
main{padding:var(--pad)}
h2.day{
  font-family:"Archivo";font-weight:800;font-size:.78rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin:22px 2px 10px;
}
h2.day:first-child{margin-top:4px}
h2.day b{color:var(--text)}

/* ---- match card: the kick-off time is the hero ---- */
.match{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 14px 12px; margin-bottom:10px; position:relative; overflow:hidden;
}
.match .toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.ko{font-family:"Archivo"; font-weight:900; font-stretch:110%;
    font-size:2.1rem; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.ko small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.12em;color:var(--faint);
          text-transform:uppercase;margin-top:3px}
.chip{
  display:inline-block; font-family:"Archivo"; font-weight:800; font-size:.72rem;
  letter-spacing:.04em; padding:5px 10px; border-radius:7px; color:#0B0D14; white-space:nowrap;
}
.chip.bbc{background:var(--bbc)} .chip.itv{background:var(--itv)}
.chip.tbc{background:var(--raise);color:var(--dim);border:1px solid var(--line)}
.teams{margin-top:10px}
.team{display:flex; align-items:center; gap:9px; font-size:1.05rem; font-weight:600; padding:3px 0}
.team .flag{font-size:1.25rem;width:1.5rem;text-align:center}
.team .score{margin-left:auto;font-family:"Archivo";font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums}
.team.winner .score{color:var(--win)}
.meta{display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:10px; font-size:.72rem; color:var(--dim)}
.meta .tag{color:var(--faint)}
.meta .tag.wx{color:var(--dim);font-variant-numeric:tabular-nums}
.badge{font-size:.66rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.badge.live{background:var(--live);color:#fff;animation:pulse 1.4s infinite}
.badge.late{background:var(--raise);color:var(--bbc);border:1px solid var(--line)}
.badge.clash{background:var(--raise);color:var(--itv);border:1px solid var(--line)}
.badge.stars{background:var(--raise);color:var(--dim);border:1px solid var(--line)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.timeline{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;font-size:.74rem;color:var(--dim)}
.timeline .gl{display:flex;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.timeline .gl .min{color:var(--faint);width:34px;flex:none;text-align:right}
.hl-btn{display:block;width:100%;margin-top:10px;background:var(--raise);border:1px solid var(--line);
  border-radius:9px;color:var(--text);font-family:"Archivo";font-weight:800;font-size:.74rem;
  padding:10px;cursor:pointer}
.hl-frame{margin-top:10px;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:#000}
.hl-frame iframe{width:100%;height:100%;border:0;display:block}
.ics{position:absolute;top:12px;right:12px;font-size:1.05rem;text-decoration:none;
     color:var(--faint);padding:6px;line-height:1}
.match .toprow{padding-right:30px}

/* hero countdown */
.next{
  background:linear-gradient(160deg,var(--raise),var(--surface));
  border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:18px; text-align:center;
}
.next .lbl{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.next .cd{font-family:"Archivo";font-weight:900;font-size:2.4rem;font-variant-numeric:tabular-nums;
          letter-spacing:-.02em;margin:6px 0 2px}
.next .who{font-size:.92rem;color:var(--text)}
.next .who .vs{color:var(--faint)}

/* tabs */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; background:rgba(15,18,28,.92);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border-top:1px solid var(--line); padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
nav button{
  flex:1; min-width:0; background:none; border:0; color:var(--faint); font-family:"Archivo";
  font-weight:700; font-size:.66rem; letter-spacing:.04em; padding:4px 0; cursor:pointer;
}
nav button .ic{display:block;font-size:1.25rem;margin-bottom:2px;filter:grayscale(1) opacity(.55)}
nav button.on{color:var(--text)} nav button.on .ic{filter:none}

/* filter pills */
.pills{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; -webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto; background:var(--surface); border:1px solid var(--line); color:var(--dim);
      border-radius:99px; padding:7px 14px; font-size:.78rem; font-weight:600; cursor:pointer}
.pill.on{background:var(--text); color:var(--bg); border-color:var(--text)}
select.pill{appearance:none;-webkit-appearance:none}

/* groups */
.gtable{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
        margin-bottom:14px;overflow:hidden}
.gtable h3{font-family:"Archivo";font-weight:800;font-size:.8rem;letter-spacing:.12em;
           padding:10px 14px;border-bottom:1px solid var(--line);color:var(--dim)}
.gtable table{width:100%;border-collapse:collapse;font-size:.82rem}
.gtable th{font-size:.6rem;letter-spacing:.08em;color:var(--faint);font-weight:700;text-align:center;padding:6px 2px}
.gtable th:first-child{text-align:left;padding-left:14px}
.gtable td{padding:7px 2px;text-align:center;font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
.gtable td.t{text-align:left;padding-left:14px;font-weight:600;white-space:nowrap}
.gtable tr.q td{box-shadow:inset 3px 0 0 var(--win)}
.gtable td.pts{font-weight:800}

/* bracket */
.bracket{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch}
.bcol{flex:0 0 230px}
.bcol h3{font-family:"Archivo";font-weight:800;font-size:.7rem;letter-spacing:.14em;
         text-transform:uppercase;color:var(--dim);margin:0 2px 8px}
.bmatch{background:var(--surface);border:1px solid var(--line);border-radius:10px;
        padding:9px 11px;margin-bottom:8px;font-size:.82rem}
.bmatch .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-weight:600}
.bmatch .row .sc{font-variant-numeric:tabular-nums;color:var(--dim)}
.bmatch .sub{font-size:.66rem;color:var(--faint);margin-top:4px;display:flex;justify-content:space-between}

/* england view */
.routecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
           padding:14px;margin-bottom:14px}
.routecard h3{font-family:"Archivo";font-weight:800;font-size:.78rem;letter-spacing:.12em;
              text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.rstep{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.rstep:first-of-type{border-top:0}
.rstep .stg{font-family:"Archivo";font-weight:800;font-size:.7rem;color:var(--faint);width:52px;flex:none}
.rstep .chip{margin-left:auto}
.note{font-size:.72rem;color:var(--faint);margin-top:10px;line-height:1.5}
.empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:.9rem;line-height:1.6}
/* stats: supercomputer + golden boot */
.scrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:.86rem}
.scrow:first-of-type{border-top:0}
.scrow .nm{font-weight:600;width:118px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrow .bar{flex:1;height:8px;background:var(--raise);border-radius:99px;overflow:hidden}
.scrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--itv),var(--bbc));border-radius:99px}
.scrow .pc{font-family:"Archivo";font-weight:800;font-variant-numeric:tabular-nums;width:52px;text-align:right;flex:none}
.probs{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:10px}
.probs i{display:block;height:100%}
.problbl{display:flex;justify-content:space-between;font-size:.64rem;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}

/* THE WINDOW — prediction picker */
.window{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.window .wlbl{display:flex;justify-content:space-between;align-items:center;font-family:"Archivo";
  font-weight:800;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase}
.window .wlbl .open{color:var(--win)} .window .wlbl .wait{color:var(--faint)}
.window .wlbl .cdown{font-variant-numeric:tabular-nums;color:var(--text)}
.picker{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 10px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--raise);color:var(--text);font-size:1.15rem;font-weight:700;cursor:pointer}
.step .v{font-family:"Archivo";font-weight:900;font-size:1.7rem;width:30px;text-align:center;
  font-variant-numeric:tabular-nums}
.picker .dash{color:var(--faint);font-weight:800}
.wrow{display:flex;gap:8px;align-items:center}
.banker{flex:1;background:var(--raise);border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-size:.72rem;font-weight:700;padding:9px;cursor:pointer}
.banker.on{background:var(--bbc);color:#0B0D14;border-color:var(--bbc)}
.lockbtn{flex:1.4;background:var(--win);border:0;border-radius:9px;color:#06280F;
  font-family:"Archivo";font-weight:800;font-size:.78rem;padding:10px;cursor:pointer}
.locked{background:var(--raise);border:1px solid var(--win);border-radius:9px;padding:9px;
  text-align:center;font-size:.78rem;color:var(--win);font-weight:700}
.reveal{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rpick{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:5px 9px;
  font-size:.7rem;font-weight:600}
.rpick b{font-family:"Archivo";font-variant-numeric:tabular-nums}
.rpick.oracle{border-color:var(--itv)} .rpick.hit{border-color:var(--win)}
.rpick .asleep{color:var(--faint)}
/* league table */
.ltable .scrow .nm{width:auto;flex:1}
.lmeta{display:flex;gap:10px;font-size:.62rem;color:var(--faint);font-variant-numeric:tabular-nums}
.lctrls{display:flex;gap:4px;flex:none}
.lact{background:var(--raise);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font-size:.8rem;line-height:1;padding:5px 7px;cursor:pointer}
.lact:active{transform:scale(.94)}
.lact.danger{color:#E5687A;border-color:#E5687A;font-size:.66rem;font-weight:700;padding:3px 8px}
h3 .lact{padding:2px 6px;font-size:.72rem;vertical-align:middle}
.adminbadge{font-size:.56rem;font-weight:800;letter-spacing:.06em;color:var(--bbc);
  border:1px solid var(--bbc);border-radius:5px;padding:1px 5px;vertical-align:middle}
.youtag{font-size:.56rem;font-weight:800;color:var(--faint);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.rcard{background:var(--raise);border:1px solid var(--bbc);border-radius:10px;padding:11px 13px;
  margin-top:12px;font-size:.74rem;line-height:1.5}
.rcode{font-family:"Archivo";font-weight:800;color:var(--bbc);letter-spacing:.02em;
  font-size:.92rem;-webkit-user-select:all;user-select:all}
.demo-ribbon{background:var(--raise);border:1px dashed var(--itv);border-radius:10px;color:var(--itv);
  font-size:.7rem;font-weight:700;padding:9px 12px;margin-bottom:14px;line-height:1.5}
.sharecard{background:var(--itv);color:#06281F;border:0;border-radius:9px;
  font-family:"Archivo";font-weight:800;font-size:.76rem;padding:11px;cursor:pointer}
.invite{display:block;width:100%;background:var(--text);color:var(--bg);border:0;border-radius:10px;
  font-family:"Archivo";font-weight:800;padding:12px;font-size:.82rem;margin-top:12px;cursor:pointer}
@media (prefers-reduced-motion: reduce){ .badge.live{animation:none} }
</style>
</head>
<body>
<header>
  <div class="wordmark">KICKOFF <span class="tv">ORACLE</span> <span style="color:var(--faint);font-weight:600;font-size:.7rem">WC26</span></div>
  <div style="display:flex;gap:12px;align-items:baseline"><a href="album.html" style="color:var(--bbc);font-size:.7rem;font-weight:800;text-decoration:none;letter-spacing:.06em">📔 ALBUM</a><div class="updated" id="updated"></div></div>
</header>
<main id="main"></main>
<nav>
  <button data-tab="today" class="on"><span class="ic">📺</span>Today</button>
  <button data-tab="fixtures"><span class="ic">🗓</span>Fixtures</button>
  <button data-tab="groups"><span class="ic">🏆</span>Groups</button>
  <button data-tab="bracket"><span class="ic">🛣</span>Bracket</button>
  <button data-tab="stats"><span class="ic">🔮</span>Stats</button>
  <button data-tab="league"><span class="ic">🏅</span>League</button>
  <button data-tab="england"><span class="ic">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span>England</button>
</nav>

<script>window.WC_API = "https://kickoff-oracle-window.abigwood.workers.dev";  // THE WINDOW backend (unset → DEMO mode)</script>
<script src="data/matches.js"></script>
<script>
"use strict";
let DATA = window.WC_DATA || {matches:[],groups:{}};
let tab = "today", teamFilter = "All", tickTimer = null;
const $ = s => document.querySelector(s);
const MARQUEE = new Set(["England","Scotland","Brazil","Argentina","France","Spain","Germany","Portugal","Netherlands","Mexico","USA"]);

/* ---------- helpers ---------- */
const fmtDay = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const todayUK = () => new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date());
const chipClass = ch => ch==="TBC" ? "tbc" : (ch.startsWith("BBC") ? "bbc" : "itv");
const isLate = m => { const h = +m.ukTime.slice(0,2); return h >= 23 || h < 6; };
const stars = m => {                                  // "worth staying up" v1 heuristic
  let s = 1;
  if (m.stage !== "Group") s = 3;
  else {
    if (MARQUEE.has(m.team1) || MARQUEE.has(m.team2)) s++;
    if (/Matchday (9|1[0-8])/.test(m.round)) s++;     // final group round = decisive
  }
  return "●".repeat(s) + "○".repeat(3-s);
};
const clashes = m => DATA.matches.filter(x => x.id!==m.id && x.ukKickoff===m.ukKickoff);
const ics = m => {
  const dt = new Date(m.ukKickoff), end = new Date(dt.getTime()+115*60000);
  const z = d => d.toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(
    ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//KickOffOracle//WC26//EN","BEGIN:VEVENT",
     `UID:wc26-${m.id}@kickofforacle`,`DTSTART:${z(dt)}`,`DTEND:${z(end)}`,
     `SUMMARY:⚽ ${m.team1} v ${m.team2} — ${m.channel}`,
     `DESCRIPTION:${m.round} · ${m.ground} · UK TV: ${m.channel}`,
     `LOCATION:${m.channel}`,"END:VEVENT","END:VCALENDAR"].join("\r\n"));
};

/* ---------- match card ---------- */
function card(m){
  const cls = clashes(m);
  const w1 = m.status==="FT" && m.score1>m.score2, w2 = m.status==="FT" && m.score2>m.score1;
  return `<article class="match">
    <a class="ics" href="${ics(m)}" download="${m.team1}-v-${m.team2}.ics" aria-label="Add to calendar">＋</a>
    <div class="toprow">
      <div class="ko">${m.ukTime}<small>UK time</small></div>
      <span class="chip ${chipClass(m.channel)}">${m.channel}</span>
    </div>
    <div class="teams">
      <div class="team ${w1?"winner":""}"><span class="flag">${m.flag1}</span>${m.team1}
        ${m.score1!=null?`<span class="score">${m.score1}</span>`:""}</div>
      <div class="team ${w2?"winner":""}"><span class="flag">${m.flag2}</span>${m.team2}
        ${m.score2!=null?`<span class="score">${m.score2}</span>`:""}</div>
    </div>
    <div class="meta">
      ${m.status==="LIVE"?`<span class="badge live">LIVE</span>`:""}
      ${isLate(m)&&m.status!=="FT"?`<span class="badge late">🌙 Late one ${stars(m)}</span>`:""}
      ${cls.length?`<span class="badge clash">⚡ Clashes: ${cls.map(c=>c.team1+" v "+c.team2).join(", ")}</span>`:""}
      <span class="tag">${m.stage==="Group"?"Group "+m.group:m.round}</span>
      <span class="tag">${m.ground}</span>
      ${m.weather?`<span class="tag wx" title="${m.weather.desc} at kick-off (local time)">${m.weather.icon} ${m.weather.temp}°C</span>`:""}
    </div>
    ${probStrip(m)}
    ${goalTimeline(m)}
    ${windowWidget(m)}
  </article>`;
}

function goalTimeline(m){
  if (m.status!=="FT" || (!m.goals?.length && !m.youtube)) return "";
  const rows = (m.goals||[]).map(g=>`<div class="gl">
      <span class="min">${g.minute??""}'</span>
      <span>⚽ ${g.name}${g.pen?" (pen)":""}${g.og?" (OG)":""} <span style="color:var(--faint)">· ${g.team}</span></span>
    </div>`).join("");
  const hl = m.youtube
    ? `<button class="hl-btn" data-hl="${m.youtube}">▶ Watch official highlights</button><div class="hl-slot"></div>`
    : "";
  return `<div class="timeline">${rows}${hl}</div>`;
}

function probStrip(m){
  const p = (DATA.matchProbs||{})[String(m.id)];
  if (!p || m.status==="FT") return "";
  const [w,d,l] = p.map(x=>Math.round(x*100));
  return `<div class="probs">
      <i style="width:${w}%;background:var(--itv)"></i>
      <i style="width:${d}%;background:var(--raise)"></i>
      <i style="width:${l}%;background:var(--bbc)"></i></div>
    <div class="problbl"><span>${m.team1} ${w}%</span><span>draw ${d}%</span><span>${m.team2} ${l}%</span></div>`;
}

function viewStats(){
  const P = (DATA.predictions||{}).teams || [];
  const sims = (DATA.predictions||{}).sims || 0;
  const top = P.filter(t=>t.win>0.2).slice(0,16);
  const max = top.length ? top[0].win : 1;
  const sc = DATA.scorers || [];
  return `<div class="gtable"><h3>🔮 THE ORACLE — WIN THE LOT</h3>
      ${top.map(t=>`<div class="scrow"><span class="nm">${t.flag} ${t.team}</span>
        <span class="bar"><i style="width:${Math.max(2,100*t.win/max)}%"></i></span>
        <span class="pc">${t.win}%</span></div>`).join("")}
      <p class="note" style="padding:0 14px 12px">The Oracle: Elo-rated teams, ${sims.toLocaleString()} tournament simulations, re-run after every result. Match cards show each game's win/draw/win odds. Information, not betting advice.</p>
    </div>
    <div class="gtable"><h3>⚽ GOLDEN BOOT</h3>
      ${sc.length ? sc.slice(0,15).map((s,i)=>`<div class="scrow">
          <span class="pc" style="width:24px;text-align:left;color:var(--faint)">${i+1}</span>
          <span class="nm" style="width:auto;flex:1">${s.name} <span style="color:var(--faint)">· ${s.flag} ${s.team}</span></span>
          <span class="pc">${s.goals}</span></div>`).join("")
        : `<p class="empty" style="padding:24px">No goals yet — the race starts with the first match. Scorers appear here automatically.</p>`}
    </div>`;
}

const byDay = list => {
  const days = {};
  list.forEach(m => (days[m.ukDate] = days[m.ukDate]||[]).push(m));
  // the feed is ordered by group, not date — sort day-groups chronologically
  return Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,ms]) =>
    `<h2 class="day">${fmtDay(d)}${d===todayUK()?" · <b>Today</b>":""}</h2>` +
    ms.sort((a,b)=>a.ukKickoff.localeCompare(b.ukKickoff)).map(card).join(""));
};

// ---- live identity (per-device, localStorage). Clearing Safari data loses it. ----
function uid(){ let u=localStorage.getItem("wc_uid");
  if(!u){ u="u_"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("wc_uid",u); }
  return u; }
const myNick = () => localStorage.getItem("wc_nick") || "";
const setNick = n => localStorage.setItem("wc_nick", n);
const myLeagueCodes = () => { try { return JSON.parse(localStorage.getItem("wc_leagues")||"[]"); } catch { return []; } };
const setLeagueCodes = a => localStorage.setItem("wc_leagues", JSON.stringify([...new Set(a)]));
// own picks cached locally so a returning player sees their locked-in pick while
// the window is still open (the Worker hides everyone's picks until it shuts).
let myPicks = DEMO ? {} : (()=>{ try { return JSON.parse(localStorage.getItem("wc_picks")||"{}"); } catch { return {}; } })();
const saveMyPicks = () => { if(!DEMO) localStorage.setItem("wc_picks", JSON.stringify(myPicks)); };

async function api(path, body){
  const opts = body ? {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)} : {};
  const r = await fetch(API+path, opts);
  return { status:r.status, j: await r.json().catch(()=>({})) };
}
// map a Worker reveal block → the shape viewLeague()/revealCard() already render.
const mapReveal = rv => ({ match: rv.match, ko: rv.ko, picks: rv.picks.map(p => ({
  nick: p.nick,
  s: p.asleep ? "😴 no pick" : `${p.s1}–${p.s2}`,
  hit: !!p.hit, exact: !!p.exact, asleep: !!p.asleep,
  pts: !p.settled ? "" : (p.exact ? "+3 🎯" : p.hit ? "+1" : "0"),
})) });
let myCode = null;                 // this device's recovery code (3 words)
async function loadLeagues(){
  if (DEMO) return;
  // /me gives this device's recovery code + the server's authoritative league list
  const me = await api("/me?uid="+encodeURIComponent(uid())).catch(()=>({status:0}));
  if (me.status===200){
    myCode = me.j.recovery;
    if (me.j.nickname && !myNick()) setNick(me.j.nickname);
    if (Array.isArray(me.j.leagues)) setLeagueCodes(me.j.leagues);
  }
  const codes = myLeagueCodes();
  const states = await Promise.all(codes.map(c => api("/state?code="+encodeURIComponent(c)).catch(()=>({status:0}))));
  LEAGUES = states.filter(s => s.status===200).map(s => ({
    code: s.j.code, name: s.j.name, owner: s.j.owner, table: s.j.table || [], reveals: (s.j.reveals||[]).map(mapReveal), orphans: [],
  }));
  setLeagueCodes(LEAGUES.map(l => l.code));
  if (activeLeague >= LEAGUES.length) activeLeague = 0;
  // admin: pull the orphan-watchdog list (likely split-device duplicates) for leagues I own
  await Promise.all(LEAGUES.filter(l => l.owner===uid()).map(async l => {
    const o = await api(`/orphans?code=${l.code}&uid=${encodeURIComponent(uid())}`).catch(()=>({status:0}));
    if (o.status===200) l.orphans = o.j.orphans || [];
  }));
}

// Adopt an existing identity (RESTORE) from a recovery code — same picks/leagues on this device.
async function restoreIdentity(){
  const code = (prompt("Enter your recovery code (e.g. otter-mango-comet) to restore your identity on this device:")||"").trim();
  if (!code) return;
  const { status, j } = await api("/restore", { code });
  if (status!==200){ alert(j.error || "That code didn't match an identity."); return; }
  localStorage.setItem("wc_uid", j.uid);
  if (j.nickname) setNick(j.nickname);
  setLeagueCodes(j.leagues || []);
  myPicks = {}; saveMyPicks();          // picks come from the server now
  activeLeague = 0;
  await loadLeagues(); render();
  alert("Restored! You're back as "+(j.nickname||"your saved identity")+" with your leagues and picks.");
}
async function joinByCode(code){
  code = code.trim().toUpperCase();
  let n = myNick();
  if (!n){ n = (prompt("Pick a nickname your mates will see:")||"").trim(); if(!n) return false; setNick(n); }
  // SMART JOIN: if someone with this name is already in the league, you're probably
  // already a member on another device — offer restore instead of duplicating.
  const who = await api(`/whois?code=${code}&nickname=${encodeURIComponent(n)}&uid=${encodeURIComponent(uid())}`).catch(()=>({status:0}));
  if (who.status===200 && who.j.taken){
    if (confirm(`Someone called "${who.j.name}" is already in this league. If that's you on another device, tap OK to RESTORE with your recovery code (keeps your picks) instead of creating a duplicate.`)){
      await restoreIdentity(); return true;
    }
  }
  const { status, j } = await api("/join", { uid:uid(), nickname:n, code });
  if (status!==200){ alert(j.error || "Couldn't join that league."); return false; }
  setLeagueCodes([...myLeagueCodes(), j.code]);
  await loadLeagues();
  activeLeague = Math.max(0, LEAGUES.findIndex(l => l.code===j.code));
  return true;
}

// Picks are open any time before KO (no more KO−60 gate), once both teams are real.
const realTeams = m => !/[\d/]/.test(m.team1) && !/[\d/]/.test(m.team2);
const windowState = m => {
  if (m.status !== "UPCOMING" || m.score1 != null) return "done";   // finished or already has a result
  if (!realTeams(m)) return "na";                          // knockout placeholders — no picker yet
  return new Date(m.ukKickoff) > new Date() ? "open" : "done";       // server re-checks & fails closed on lock-in
};

function windowWidget(m){
  if (windowState(m) !== "open") return "";
  const mins = (new Date(m.ukKickoff) - new Date()) / 60000;
  const head = mins < 60

    : `<span class="open">🪟 PICK OPEN</span><span class="wait">locks at KO · ${m.ukTime}</span>`;
  const p = myPicks[m.id] || {s1:0, s2:0};

  return `<div class="window" data-wid="${m.id}"><div class="wlbl">${head}</div>
    ${has?`<div class="locked" style="margin-bottom:8px">🔒 Your pick: ${m.team1} ${p.s1}–${p.s2} ${m.team2}<br>

/* ---------- views ---------- */
function viewToday(){
  const t = todayUK();
  const todays = DATA.matches.filter(m=>m.ukDate===t);
  const next = DATA.matches.filter(m=>m.status==="UPCOMING" && new Date(m.ukKickoff)>new Date())
                           .sort((a,b)=>a.ukKickoff.localeCompare(b.ukKickoff))[0];
  let hero = "";
  if (next) hero = `<div class="next"><div class="lbl">Next kick-off · ${next.channel}</div>
      <div class="cd" id="cd" data-ko="${next.ukKickoff}">—</div>
      <div class="who">${next.flag1} ${next.team1} <span class="vs">v</span> ${next.team2} ${next.flag2}</div></div>`;
  if (!todays.length){
    const up = DATA.matches.filter(m=>m.ukDate>t).sort((a,b)=>a.ukKickoff.localeCompare(b.ukKickoff)).slice(0,6);
    return hero + `<div class="empty">No matches today.<br>Here's what's next:</div>` + byDay(up).join("");
  }
  return hero + byDay(todays).join("");
}

function viewFixtures(){
  const teams = [...new Set(DATA.matches.flatMap(m=>[m.team1,m.team2]))]
                .filter(t=>!/^\d|^W\d|\//.test(t)).sort();

/* ---------- reveal card: canvas image for the group chat ---------- */
async function revealCard(rv){
  const W=1080,H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  // night-broadcast backdrop
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#10141F"); g.addColorStop(1,"#0B0D14");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle="#1A2032"; for(let i=0;i<W;i+=72){ x.fillRect(i,0,1,H); }   // faint pitch lines
  // header
  x.fillStyle="#FFD230"; x.font="900 54px -apple-system,Archivo,sans-serif";
  x.fillText("🪟 WINDOW SHUT",60,120);
  x.fillStyle="#EEF1F7"; x.font="800 64px -apple-system,sans-serif";
  wrapText(x, rv.match, 60, 210, W-120, 74);
  x.fillStyle="#8A93A8"; x.font="600 34px -apple-system,sans-serif";
  x.fillText("Everyone's picks, locked before kick-off:",60,300);
  // pick rows
  let y=370;
  rv.picks.forEach(p=>{
    x.fillStyle = p.exact ? "#16321F" : (p.hit ? "#15271B" : "#161B2A");
    rRect(x,60,y-58,W-120,96,18); x.fill();
    x.strokeStyle = p.exact ? "#39D98A" : (p.hit ? "#2BD9CE" : "#242C42"); x.lineWidth=3;
    rRect(x,60,y-58,W-120,96,18); x.stroke();
    x.fillStyle = p.asleep ? "#5A6378" : "#EEF1F7";
    x.font="700 42px -apple-system,sans-serif"; x.fillText(p.nick,92,y);
    x.font="900 46px -apple-system,sans-serif"; x.textAlign="center";
    x.fillText(p.s + (p.exact?" 🎯":""), W/2+120, y);
    x.textAlign="right"; x.fillStyle="#8A93A8"; x.font="700 38px -apple-system,sans-serif";
    x.fillText(p.pts, W-92, y); x.textAlign="left";
    y+=124;
  });
  // footer
  x.fillStyle="#242C42"; x.fillRect(60,H-150,W-120,2);
  x.fillStyle="#8A93A8"; x.font="700 32px -apple-system,sans-serif";
  x.fillText("🎯 exact = 3 pts · result = 1 pt",60,H-90);
  x.textAlign="right"; x.fillStyle="#FFD230"; x.font="900 36px -apple-system,sans-serif";
  x.fillText("KICKOFF ORACLE · "+LEAGUE.name, W-60, H-90); x.textAlign="left";
  return new Promise(res=>c.toBlob(res,"image/png"));
}
function rRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function wrapText(x,t,a,b,maxW,lh){const words=t.split(" ");let line="",yy=b;
  for(const w of words){const test=line?line+" "+w:w;
    if(x.measureText(test).width>maxW && line){x.fillText(line,a,yy);line=w;yy+=lh;}else line=test;}
  x.fillText(line,a,yy);}
async function shareCard(ri){
  const blob = await revealCard((LEAGUE.shownReveals||LEAGUE.reveals)[ri]);
  const file = new File([blob],"reveal.png",{type:"image/png"});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:"Window shut — picks revealed"}); return;}catch(e){}
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="reveal.png"; a.click();
}
function wrapTextY(x,t,a,b,maxW,lh){const words=t.split(" ");let line="",yy=b;
  for(const w of words){const test=line?line+" "+w:w;
    if(x.measureText(test).width>maxW && line){x.fillText(line,a,yy);line=w;yy+=lh;}else line=test;}
  x.fillText(line,a,yy); return yy;}
// Shareable STANDINGS card — same look as the reveal cards. Shows only the
// table (rank/name/points/exacts/streak) — never anyone's picks (privacy).
async function tableCard(L){
  const W=1080,H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#10141F"); g.addColorStop(1,"#0B0D14");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle="#1A2032"; for(let i=0;i<W;i+=72){ x.fillRect(i,0,1,H); }   // faint pitch lines
  x.fillStyle="#FFD230"; x.font="900 50px -apple-system,Archivo,sans-serif"; x.fillText("🏆 LEAGUE TABLE",60,116);
  x.fillStyle="#EEF1F7"; x.font="800 60px -apple-system,sans-serif";
  const ny=wrapTextY(x, L.name, 60, 196, W-120, 70);
  const stamp=new Date(DATA.updated||Date.now()).toLocaleDateString("en-GB",{day:"numeric",month:"long"});
  x.fillStyle="#8A93A8"; x.font="600 32px -apple-system,sans-serif"; x.fillText("Standings · "+stamp, 60, ny+44);
  const rows=L.table||[], top=ny+90, rowH=Math.max(70,Math.min(116,(H-top-170)/Math.max(rows.length,1)));
  let y=top;
  rows.forEach((r,i)=>{
    const t3=i<3, medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":null, bh=rowH-12;
    x.fillStyle=t3?"#16321F":"#161B2A"; rRect(x,60,y,W-120,bh,16); x.fill();
    x.strokeStyle=t3?"#39D98A":"#242C42"; x.lineWidth=t3?3:2; rRect(x,60,y,W-120,bh,16); x.stroke();
    const mid=y+bh/2;
    x.textAlign="center"; x.fillStyle=t3?"#FFD230":"#8A93A8"; x.font="900 40px -apple-system,Archivo,sans-serif";
    x.fillText(medal||String(i+1), 122, mid+14);
    x.textAlign="left"; x.fillStyle="#EEF1F7"; x.font="800 40px -apple-system,sans-serif"; x.fillText(r.nick, 200, mid-2);
    x.fillStyle="#8A93A8"; x.font="600 26px -apple-system,sans-serif"; x.fillText(`${r.exact} exact · ${r.streak}`, 200, mid+32);
    x.textAlign="right"; x.fillStyle=t3?"#39D98A":"#EEF1F7"; x.font="900 52px -apple-system,Archivo,sans-serif"; x.fillText(String(r.pts), W-100, mid+8);
    x.fillStyle="#8A93A8"; x.font="600 24px -apple-system,sans-serif"; x.fillText("pts", W-100, mid+36);
    x.textAlign="left"; y+=rowH;
  });
  x.fillStyle="#242C42"; x.fillRect(60,H-150,W-120,2);
  x.textAlign="left"; x.fillStyle="#8A93A8"; x.font="700 30px -apple-system,sans-serif"; x.fillText("🎯 exact = 3 · result = 1 · join with code "+L.code, 60, H-92);
  x.textAlign="right"; x.fillStyle="#FFD230"; x.font="900 36px -apple-system,Archivo,sans-serif"; x.fillText("KICKOFF ORACLE", W-60, H-92); x.textAlign="left";
  return new Promise(res=>c.toBlob(res,"image/png"));
}
async function shareTable(){
  const L=LEAGUE; if(!L) return;
  const blob=await tableCard(L);
  const file=new File([blob],"league-table.png",{type:"image/png"});
  const link=location.origin+location.pathname+"?league="+L.code;
  const text=`🏆 ${L.name} — World Cup predictor league table. Tap to join and get your picks in: ${link}`;
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text, title:L.name}); return; }catch(e){}
  }
  if (navigator.share){ try{ await navigator.share({text, title:L.name}); }catch(e){} }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="league-table.png"; a.click();
}

/* ---------- render & wire-up ---------- */
function render(){
  const views = {today:viewToday,fixtures:viewFixtures,groups:viewGroups,bracket:viewBracket,stats:viewStats,league:viewLeague,england:viewEngland};
  $("#main").innerHTML = views[tab]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if (DATA.updated) $("#updated").textContent = "Updated " +
    new Date(DATA.updated).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  if (!navigator.onLine && $("#updated")){ $("#updated").textContent = "⚠️ Offline · last saved data"; $("#updated").style.color = "var(--live)"; }
  else if ($("#updated")) $("#updated").style.color = "";
  clearInterval(tickTimer);
  const cd = $("#cd");
  if (cd){
    const tick = ()=>{ const d = new Date(cd.dataset.ko)-Date.now();
      if (d<=0){ cd.textContent="KICK-OFF"; return; }
      const h=Math.floor(d/36e5), m=Math.floor(d%36e5/6e4), s=Math.floor(d%6e4/1e3);
      cd.textContent = (h?`${h}h `:"")+`${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`; };
    tick(); tickTimer = setInterval(tick,1000);
  }
  const wcds = document.querySelectorAll("[data-wcd]");
  if (wcds.length){
    const wt = ()=>wcds.forEach(el=>{ const d = new Date(el.dataset.wcd)-Date.now();
      el.textContent = d<=0 ? "SHUT" : "shuts in "+Math.floor(d/6e4)+":"+String(Math.floor(d%6e4/1e3)).padStart(2,"0"); });
    wt(); setInterval(wt,1000);
  }
}
document.querySelector("nav").addEventListener("click",async e=>{
  const b = e.target.closest("button"); if(!b) return; tab=b.dataset.tab; render(); scrollTo(0,0);
  if (tab==="league" && API){ await loadLeagues(); render(); }   // pull fresh table/reveals
});
document.addEventListener("click",async e=>{
  const p = e.target.closest(".pill[data-team]"); if(p){ teamFilter=p.dataset.team; render(); return; }
  if (e.target.closest("[data-sharetable]")){ shareTable(); return; }
  const sc = e.target.closest(".sharecard[data-card]"); if(sc){ shareCard(+sc.dataset.card); return; }
  const lg = e.target.closest("[data-lg]");
  if (lg){
    if (lg.dataset.lg==="join"){
      if (DEMO){
        const code = prompt("Enter a league code to join, or leave blank to create a new league:");
        if (code===null) return;
        alert("Joining and creating leagues goes live with the Worker — this demo has two sample leagues to show how switching works.");
        return;
      }
      let n = myNick();
      if (!n){ n = (prompt("Pick a nickname your mates will see:")||"").trim(); if(!n) return; setNick(n); }
      const code = prompt("Enter a mate's league code to JOIN — or leave blank to CREATE a new league:");
      if (code===null) return;
      if (code.trim()===""){
        const name = (prompt("Name your new league:")||"").trim() || "My League";
        const { status, j } = await api("/league", { uid:uid(), nickname:n, name });
        if (status!==200){ alert(j.error || "Couldn't create the league."); return; }
        setLeagueCodes([...myLeagueCodes(), j.code]);
        await loadLeagues();
        activeLeague = Math.max(0, LEAGUES.findIndex(l=>l.code===j.code));
        render();
        alert("League created 🎉\n\nShare this code in the group chat:\n\n  "+j.code+"\n\nMates tap ＋ Join / create and enter it.");
      } else if (await joinByCode(code)){
        render();
      }
      return;
    }
    activeLeague = +lg.dataset.lg; render(); return;
  }

  // ---- THE WINDOW: self-service + admin controls (live mode) ----
  if (API && e.target.closest(".lact")){
    const L = LEAGUE;
    if (e.target.closest("[data-restore]")){ await restoreIdentity(); return; }
    const mg = e.target.closest("[data-merge]");
    if (mg){
      const [dropUid, keepUid, code] = mg.dataset.merge.split("|");
      const lg = LEAGUES.find(l=>l.code===code) || L;
      const keepNick = ((lg.table||[]).find(r=>r.uid===keepUid)||{}).nick || "the member";
      if (!confirm("Merge these unlinked picks into "+keepNick+"? Their picks move onto "+keepNick+" and the spare device identity is removed. Can't be undone.")) return;
      const { status, j } = await api("/merge", { uid:uid(), code, keepUid, dropUid });
      if (status!==200){ alert(j.error||"Couldn't merge."); return; }
      await loadLeagues(); render();
      alert("Merged — moved "+(j.movedPicks||0)+" pick"+(((j.movedPicks||0)===1)?"":"s")+" onto "+keepNick+".");
      return;
    }
    const editnick = e.target.closest("[data-editnick]");
    if (editnick){
      const myRow = L.table.find(r=>r.uid===uid());
      const current = myRow ? myRow.nick : myNick();
      const n = (prompt("Your name in "+L.name+" (you can go by a different name in each league):", current)||"").trim();
      if (!n || n===current) return;
      const { status, j } = await api("/nick", { uid:uid(), code:L.code, nickname:n });  // per-league
      if (status!==200){ alert(j.error||"Couldn't update your name."); return; }
      await loadLeagues(); render(); return;
    }
    const leave = e.target.closest("[data-leave]");
    if (leave){
      if (!confirm("Leave "+L.name+"? Your row drops out of this league's table. Your picks stay yours and keep counting in your other leagues.")) return;
      const code = leave.dataset.leave;
      const { status, j } = await api("/leave", { uid:uid(), code });
      if (status!==200){ alert(j.error||"Couldn't leave."); return; }
      setLeagueCodes(myLeagueCodes().filter(c=>c!==code));
      activeLeague = 0; await loadLeagues(); render(); return;
    }
    const kick = e.target.closest("[data-kick]");
    if (kick){
      const target = kick.dataset.kick;
      const row = L.table.find(r=>r.uid===target);
      if (!confirm("Remove "+(row?row.nick:"this member")+" from "+L.name+"?")) return;
      const { status, j } = await api("/kick", { uid:uid(), code:L.code, target });
      if (status!==200){ alert(j.error||"Couldn't remove them."); return; }
      await loadLeagues(); render(); return;
    }
    const rename = e.target.closest("[data-rename]");
    if (rename){
      const name = (prompt("Rename league:", L.name)||"").trim();
      if (!name || name===L.name) return;
      const { status, j } = await api("/rename", { uid:uid(), code:rename.dataset.rename, name });
      if (status!==200){ alert(j.error||"Couldn't rename."); return; }
      await loadLeagues(); render(); return;
    }
    if (e.target.closest("[data-startagain]")){
      if (!confirm("Start again? You'll leave every league and your nickname/identity on this device is wiped. This can't be undone.")) return;
      for (const code of myLeagueCodes()){ await api("/leave", { uid:uid(), code }); }
      ["wc_uid","wc_nick","wc_leagues","wc_picks"].forEach(k=>localStorage.removeItem(k));
      LEAGUES = []; activeLeague = 0; myPicks = {};
      render(); return;
    }
  }

  const hb = e.target.closest(".hl-btn");
  if (hb){
    const slot = hb.nextElementSibling;
    slot.innerHTML = `<div class="hl-frame"><iframe
      src="https://www.youtube-nocookie.com/embed/${hb.dataset.hl}"
      title="Official match highlights" loading="lazy" allowfullscreen
      allow="encrypted-media; picture-in-picture"></iframe></div>`;
    hb.remove(); return;
  }
  const w = e.target.closest("[data-wid]");
  if (w){
    const id = w.dataset.wid;
    const st = e.target.closest("[data-st]");
    if (st){ const [k,d] = st.dataset.st.split(","); const v = w.querySelector(`[data-v="${k}"]`);
      v.textContent = Math.max(0, Math.min(9, +v.textContent + +d)); return; }
    if (e.target.closest("[data-lock]")){
      const s1 = +w.querySelector('[data-v="s1"]').textContent,
            s2 = +w.querySelector('[data-v="s2"]').textContent;
      if (API){
        const btn = e.target.closest("[data-lock]"); const label = btn.textContent;
        btn.disabled = true; btn.textContent = "Saving…";
        // server-side check is authoritative — rejects at/after KO and placeholder teams
        const { status, j } = await api("/pick", { uid:uid(), nickname:myNick()||"Anon", matchId:+id, s1, s2 });
        if (status!==200){
          btn.disabled = false; btn.textContent = label;
          alert(j.error==="window has shut" ? "Too late — picks shut at kick-off." :
                j.error==="teams not confirmed yet" ? "Both teams aren't confirmed yet — you can pick once they're known." :
                (j.error || "Couldn't save that. Try again."));
          return;
        }
      }
      myPicks[id] = {s1,s2}; saveMyPicks();
      render(); return;
    }
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="teamsel" && e.target.value){ teamFilter=e.target.value; render(); }
});

/* try to refresh from JSON when hosted (falls back silently on file://) */
fetch("data/matches.json",{cache:"no-store"}).then(r=>r.json())
  .then(d=>{ DATA=d; render(); }).catch(()=>{});
render();

/* THE WINDOW: load the player's leagues, and honour ?league=CODE invite links */
if (API){
  (async () => {
    const invite = new URLSearchParams(location.search).get("league");
    if (invite && !myLeagueCodes().includes(invite.toUpperCase())){
      if (confirm("Join the predictor league with code "+invite.toUpperCase()+"?")){
        await joinByCode(invite);
        tab = "league";
        history.replaceState(null,"",location.pathname);   // drop the code from the URL
      }
    }
    await loadLeagues();
    render();
  })();
}
// live refresh: keep the visible tab current — match scores on Today, and the
// league table + reveals on League (so tables update right after full-time).
setInterval(async ()=>{
  if (document.hidden) return;                       // don't poll in the background
  try { DATA = await (await fetch("data/matches.json",{cache:"no-store"})).json(); } catch {}
  if (tab==="league" && API){ try { await loadLeagues(); } catch {} render(); }
  else if (tab==="today") render();
}, 60000);

// PWA: register the service worker (offline shell + always-fresh data/API)
if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
// reflect connectivity + pull fresh the moment we're back online
addEventListener("offline", render);
addEventListener("online", () => { fetch("data/matches.json",{cache:"no-store"}).then(r=>r.json())
  .then(d=>{ DATA=d; if(tab==="league"&&API){ loadLeagues().then(render); } else render(); }).catch(render); });
</script>
