name: Refresh match data

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min — tables update fast after full-time
                             # (GitHub may delay/coalesce scheduled runs under load)
  workflow_dispatch:          # manual run button

permissions:
  contents: write

# Cloudflare cron drives this every 5 min — never let two runs overlap and race
# on the data push (queue the next instead).
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        env:
          WINDOW_API: https://kickoff-oracle-window.abigwood.workers.dev
          SETTLE_SECRET: ${{ secrets.SETTLE_SECRET }}
        run: |
          python3 find_highlights.py || true
          python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "wc26-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "data refresh $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true   # tolerate concurrent refresh pushes
          git push
