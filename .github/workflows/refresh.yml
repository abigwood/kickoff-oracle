name: Refresh match data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (free on public repos)
  workflow_dispatch:          # manual run button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        run: |
          python3 find_highlights.py || true
          python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "wc26-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data refresh $(date -u +'%Y-%m-%d %H:%M')"
          git push
